# Tutorial 3 - CI using GitHub Actions
# This workflow will build the Java project with Maven and run all unit tests.

name: Build with Maven

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Maven Tests
        run: mvn clean test
